name: Refresh Build Quest

# Maintains a single evergreen gamified GitHub contribution view.
# GitHub's public contribution calendar is the source; private work only
# appears anonymously when enabled in the account profile settings.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * *"

permissions:
  contents: write

concurrency:
  group: build-quest-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public profile repository
        uses: actions/checkout@v4

      - name: Generate verified light and dark animation assets
        run: python3 scripts/update_build_quest.py

      - name: Publish to existing output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
