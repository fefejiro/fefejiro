name: Generate Contribution Snake

# GitHub's contribution graph is authoritative. Private work only appears
# in anonymized form when the account owner enables that visibility setting.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - TECHNICAL_WORK.md
      - .github/workflows/snake.yml
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark GitHub contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2306B6D4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%232563EB

      - name: Publish output images without exposing private repository content
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
