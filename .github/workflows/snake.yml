name: Refresh Build Quest

# One rolling, anonymized public contribution game.
# No private repository code, credentials or personal information is accessed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_build_quest.py
      - .github/workflows/snake.yml
  schedule:
    - cron: "37 8 * * *"

permissions:
  contents: write

concurrency:
  group: build-quest-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate current light and dark graphics
        run: python3 scripts/update_build_quest.py

      - name: Publish verified graphics only if they changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin output
          git checkout -B output origin/output
          cp dist/github-contribution-grid-snake.svg github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg github-contribution-grid-snake-dark.svg
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Public activity graphics already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): sync Build Quest from GitHub contribution data"
          git push origin HEAD:output
